[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretally"
version = "0.1.0"
description = "A local-first, defensive PCAP/PCAPNG metadata analysis workbench."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2,<3",
  "uvicorn>=0.27,<1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
