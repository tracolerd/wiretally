<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">WireTally — Defensive Network Investigation</title>
  <desc id="desc">An animated network-flow illustration for the WireTally project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b2636"/>
      <stop offset="100%" stop-color="#103b43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8de5e4" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 292 C190 230 290 360 480 286 S830 218 1200 274" fill="none" stroke="#5eead4" stroke-opacity=".13" stroke-width="2"/>
  <path d="M0 316 C200 250 316 380 540 300 S910 246 1200 298" fill="none" stroke="#60a5fa" stroke-opacity=".12" stroke-width="2"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="66" y="74" fill="#99f6e4" font-size="14" font-weight="700" letter-spacing="4">DEFENSIVE NETWORK FORENSICS</text>
    <text x="62" y="151" fill="#f0fdfa" font-size="64" font-weight="800" letter-spacing="1">WireTally</text>
    <rect x="66" y="175" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="66" y="217" fill="#c6d9e2" font-size="23" font-weight="500">Turn packet captures into evidence.</text>
    <text x="66" y="254" fill="#8aaab7" font-size="15">Offline PCAP analysis  ·  Flow aggregation  ·  Rule-based findings</text>
    <g transform="translate(66 286)">
      <rect width="178" height="32" rx="16" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".42"/>
      <text x="89" y="21" text-anchor="middle" fill="#99f6e4" font-size="12" font-weight="700" letter-spacing="1">LOCAL-FIRST</text>
      <rect x="190" width="197" height="32" rx="16" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".42"/>
      <text x="288" y="21" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="700" letter-spacing=".8">EVIDENCE-LED</text>
    </g>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M720 94 L824 145 L931 93 L1062 147 L1117 86" stroke="#5eead4" stroke-opacity=".5" stroke-width="2"/>
    <path d="M720 94 L752 211 L880 248 L1000 205 L1062 147" stroke="#60a5fa" stroke-opacity=".46" stroke-width="2"/>
    <path d="M824 145 L880 248 M931 93 L1000 205 M752 211 L824 145 M1000 205 L1122 260" stroke="#b6f3ee" stroke-opacity=".27" stroke-width="1.5"/>
    <path d="M718 94 L824 145 L931 93 L1062 147 L1117 86" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="12 18" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;-120" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g filter="url(#glow)">
    <g fill="#0b2636" stroke="#5eead4" stroke-width="2">
      <circle cx="720" cy="94" r="10"/><circle cx="824" cy="145" r="12"/><circle cx="931" cy="93" r="9"/>
      <circle cx="1062" cy="147" r="12"/><circle cx="1117" cy="86" r="8"/>
      <circle cx="752" cy="211" r="8"/><circle cx="880" cy="248" r="10"/><circle cx="1000" cy="205" r="9"/><circle cx="1122" cy="260" r="7"/>
    </g>
    <g fill="#99f6e4">
      <circle cx="720" cy="94" r="3"/><circle cx="824" cy="145" r="4"/><circle cx="931" cy="93" r="3"/>
      <circle cx="1062" cy="147" r="4"/><circle cx="1117" cy="86" r="3"/><circle cx="752" cy="211" r="3"/>
      <circle cx="880" cy="248" r="3"/><circle cx="1000" cy="205" r="3"/><circle cx="1122" cy="260" r="2.5"/>
    </g>
    <circle r="5" fill="#ffffff">
      <animateMotion dur="6s" repeatCount="indefinite" path="M720 94 L824 145 L931 93 L1062 147 L1117 86"/>
    </circle>
    <circle r="4" fill="#60a5fa">
      <animateMotion dur="7.5s" repeatCount="indefinite" path="M720 94 L752 211 L880 248 L1000 205 L1062 147"/>
    </circle>
  </g>
  <text x="1140" y="333" text-anchor="end" fill="#7ba8b6" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">WIRETALLY / NETWORK SIGNALS</text>
</svg>